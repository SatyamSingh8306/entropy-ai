[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "entropy-ai"
version = "0.2.0"
description = "Python AI agent evaluation and testing: Monte Carlo trials, behavioral entropy, drift detection and regression checks"
keywords = ["ai-agent-evaluation", "llm-evaluation", "agent-testing", "monte-carlo", "behavioral-entropy", "drift-detection"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Testing",
]
readme = "README.md"
license = "MIT"
authors = [
    { name = "Satyam Singh", email = "satyamsingh7734@gmail.com" },
]

requires-python = ">=3.9"
dependencies = [
    "pandas",
    "matplotlib",
    "jinja2",
    "rich",
    "pyyaml",
]

[project.optional-dependencies]
pdf = ["reportlab"]
jupyter = ["nbformat"]
hf = ["datasets"]
langchain = ["langchain"]
langgraph = ["langgraph"]
openai = ["openai", "openai-agents"]
crewai = ["crewai"]
pydanticai = ["pydantic-ai"]
autogen = ["autogen"]
google-adk = ["google-adk"]
mcp = ["mcp"]

[tool.setuptools.packages.find]
include = ["entropy*"]

[project.scripts]
entropy = "entropy.cli.main:main"

[project.urls]
Homepage = "https://satyamsingh8306.github.io/entropy-ai/"
Documentation = "https://satyamsingh8306.github.io/entropy-ai/guide/quickstart.html"
Repository = "https://github.com/SatyamSingh8306/entropy-ai"
Issues = "https://github.com/SatyamSingh8306/entropy-ai/issues"
